name: suroy

x-backend-environment: &backend-environment
  APP_ENV: production
  APP_DEBUG: ${APP_DEBUG:-false}
  APP_URL: ${APP_URL:-http://localhost:8080}
  APP_KEY: ${APP_KEY:-}
  APP_LOCALE: en
  LOG_CHANNEL: stderr
  DB_CONNECTION: sqlite
  DB_DATABASE: /var/www/html/storage/database.sqlite
  SESSION_DRIVER: database
  SESSION_LIFETIME: 120
  QUEUE_CONNECTION: database
  CACHE_STORE: database
  FILESYSTEM_DISK: local
  BROADCAST_CONNECTION: reverb
  REVERB_APP_ID: ${REVERB_APP_ID:-lakbai-local}
  REVERB_APP_KEY: ${REVERB_APP_KEY:-lakbai-local-key}
  REVERB_APP_SECRET: ${REVERB_APP_SECRET:-lakbai-local-secret}
  # Server-to-server publishing stays on the compose network. The browser
  # connects through the published port 6001 (see the web build args below).
  REVERB_HOST: reverb
  REVERB_PORT: ${REVERB_PORT:-6001}
  REVERB_SCHEME: ${REVERB_SCHEME:-http}
  REVERB_SERVER_HOST: 0.0.0.0
  REVERB_SERVER_PORT: 6001
  ADMIN_EMAIL: ${ADMIN_EMAIL:-}
  ADMIN_NAME: ${ADMIN_NAME:-Administrator}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}

services:
  app:
    build:
      context: ./backend
    image: suroy/backend
    # Read Google OAuth / frontend settings from the compose file's .env,
    # so the values no longer depend on which folder you run compose from.
    env_file:
      - path: ./.env
        required: false
    environment: *backend-environment
    ports:
      - "8000:8080"
    volumes:
      - suroy-storage:/var/www/html/storage
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/up"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  reverb:
    image: suroy/backend
    environment: *backend-environment
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=6001"]
    ports:
      - "6001:6001"
    volumes:
      - suroy-storage:/var/www/html/storage
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  queue:
    image: suroy/backend
    environment: *backend-environment
    command: ["php", "artisan", "queue:work", "--sleep=1", "--tries=3", "--timeout=90"]
    volumes:
      - suroy-storage:/var/www/html/storage
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
        VITE_REVERB_APP_KEY: ${REVERB_APP_KEY:-lakbai-local-key}
        VITE_REVERB_HOST: ${REVERB_HOST:-localhost}
        VITE_REVERB_PORT: ${REVERB_PORT:-6001}
        VITE_REVERB_SCHEME: ${REVERB_SCHEME:-http}
    image: suroy/web
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - suroy-storage:/var/www/storage:ro
    depends_on:
      - app
    restart: unless-stopped

volumes:
  suroy-storage:
