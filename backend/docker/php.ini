; PHP defaults (upload_max_filesize=2M) reject a photo before Laravel's own
; validation runs, which surfaced as an unexplained failed save. Keep PHP above
; the app rules so admins get a readable validation message instead.
;
; The app accepts up to 8 photos of 2 MB each per destination, so the request
; limit must cover the whole multipart body plus overhead.
upload_max_filesize = 10M
post_max_size = 24M
memory_limit = 256M
